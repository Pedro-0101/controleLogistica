<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Controle Logística — Tela de Testes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%233b82f6'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #0f1420; --panel: #171e2e; --border: #26314a; --text: #e6ebf5;
    --muted: #8b96ad; --accent: #3b82f6; --green: #22c55e; --amber: #f59e0b;
    --red: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  header {
    padding: 18px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 13px; }
  main {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    padding: 24px; max-width: 1100px; margin: 0 auto;
  }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px;
  }
  .card h2 { margin: 0 0 14px; font-size: 15px; font-weight: 600; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
  select, input[type=file], input[type=number] {
    width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: #0b101b; color: var(--text); font-size: 14px;
  }
  input[type=file] { cursor: pointer; }
  button {
    width: 100%; margin-top: 18px; padding: 12px; border: 0; border-radius: 8px;
    background: var(--accent); color: white; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secundario { background: #26314a; color: var(--text); }
  .porta-row { display: flex; gap: 8px; align-items: stretch; }
  .porta-row select { flex: 1; }
  .porta-row button { width: auto; margin: 0; padding: 9px 14px; white-space: nowrap; }
  .botoes { display: flex; gap: 8px; }
  .botoes button { flex: 1; margin-top: 12px; }
  .divider { height: 1px; background: var(--border); margin: 18px 0; }
  .status {
    margin-top: 14px; padding: 10px 12px; border-radius: 8px; background: #0b101b;
    border: 1px solid var(--border); font-size: 12px; color: var(--muted);
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    white-space: pre-wrap; word-break: break-all;
  }
  .status.serial { border-color: var(--green); color: var(--text); }
  .dot.serial { background: var(--green); }
  .dot.simulador { background: var(--amber); }
  .peso {
    display: flex; align-items: baseline; gap: 16px; margin: 8px 0;
  }
  .peso .valor { font-size: 42px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .peso .unidade { color: var(--muted); }
  .peso-estavel { font-size: 13px; color: var(--muted); }
  .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--green); margin-right: 6px; animation: pulse 1.2s infinite;
  }
  @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:.3} }
  .preview { max-width: 100%; max-height: 220px; border-radius: 8px; margin-top: 8px; display: none; }
  .resultado {
    margin-top: 16px; padding: 14px; border-radius: 8px; background: #0b101b;
    border: 1px solid var(--border); font-size: 13px; display: none;
    white-space: pre-wrap; font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  .resultado.ok { display: block; border-color: var(--green); }
  .resultado.err { display: block; border-color: var(--red); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .badge.carregamento { background: #16331f; color: #4ade80; }
  .badge.descarregamento { background: #3a1d1d; color: #f87171; }
  .badge.sem_pesagem { background: #2a2f3a; color: #9aa4b8; }
  .badge.aberta { background: #3a2c12; color: #fbbf24; }
  .badge.fechada { background: #16283a; color: #60a5fa; }
  .badge.pesagem_parcial { background: #3a2c12; color: #fbbf24; }
  .full { grid-column: 1 / -1; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .toolbar h2 { margin: 0; }
  .toolbar button { width: auto; margin: 0; padding: 8px 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .3px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:hover { background: #0b101b; }
  .vazio { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Controle Logística</h1>
  <span class="sub">Tela de testes — portaria e balança</span>
</header>

<main>
  <section class="card">
    <h2>Ponto de coleta</h2>
    <label for="ponto">Ponto</label>
    <select id="ponto">
      <option value="PORTARIA_ENTRADA">Portaria — Entrada</option>
      <option value="PORTARIA_SAIDA">Portaria — Saída</option>
      <option value="BALANCA">Balança</option>
    </select>

    <label for="foto">Foto (placa do veículo)</label>
    <input type="file" id="foto" accept="image/*" />
    <img id="preview" class="preview" alt="pré-visualização" />

    <button id="analisar">Iniciar análise</button>

    <div id="resultado" class="resultado"></div>
  </section>

  <section class="card">
    <h2>Peso em tempo real</h2>
    <div class="peso">
      <span class="dot simulador" id="peso-dot"></span>
      <span class="valor" id="peso-atual">—</span>
      <span class="unidade">kg</span>
    </div>
    <div class="peso-estavel" id="peso-estavel">Peso estável: aguardando...</div>

    <div class="divider"></div>

    <label for="porta">Porta serial (balança)</label>
    <div class="porta-row">
      <select id="porta"></select>
      <button id="atualizar-portas" type="button">Atualizar</button>
    </div>

    <label for="baudrate">Baudrate</label>
    <input id="baudrate" type="number" value="9600" min="300" step="1" />

    <div class="botoes">
      <button id="conectar-porta" type="button">Conectar</button>
      <button id="detectar-porta" type="button" class="secundario">Detectar</button>
      <button id="usar-simulador" type="button" class="secundario">Simulador</button>
    </div>

    <div class="status" id="balanca-status">Carregando portas...</div>
  </section>

  <section class="card full">
    <div class="toolbar">
      <h2>Movimentações</h2>
      <button id="atualizar" type="button">Atualizar</button>
    </div>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Placa</th>
            <th>Status</th>
            <th>Tipo</th>
            <th class="num">P. entrada</th>
            <th class="num">P. saída</th>
            <th class="num">Líquido</th>
            <th>Criado em</th>
            <th>Fechado em</th>
          </tr>
        </thead>
        <tbody id="tabela-body"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const resultado = $("resultado");

function mostrarResultado(texto, ok = true) {
  resultado.innerHTML = texto;
  resultado.className = "resultado " + (ok ? "ok" : "err");
}

function badge(tipo, status) {
  if (status === "aberta") return `<span class="badge aberta">aberta</span>`;
  if (status === "fechada") return `<span class="badge fechada">fechada</span>`;
  if (tipo) return `<span class="badge ${tipo}">${tipo}</span>`;
  return "";
}

function fmtData(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleString("pt-BR");
}

async function carregarMovimentacoes() {
  const body = $("tabela-body");
  try {
    const r = await fetch("/movimentacoes?limite=200");
    const movs = await r.json();
    if (!movs.length) {
      body.innerHTML = `<tr><td colspan="8" class="vazio">Nenhuma movimentação registrada.</td></tr>`;
      return;
    }
    body.innerHTML = movs.map(m => `
      <tr>
        <td>${m.placa ?? "—"}</td>
        <td>${badge(null, m.status)}</td>
        <td>${badge(m.tipo, null)}</td>
        <td class="num">${m.peso_entrada != null ? m.peso_entrada.toFixed(1) : "—"}</td>
        <td class="num">${m.peso_saida != null ? m.peso_saida.toFixed(1) : "—"}</td>
        <td class="num">${m.peso_liquido != null ? m.peso_liquido.toFixed(1) : "—"}</td>
        <td>${fmtData(m.criado_em)}</td>
        <td>${fmtData(m.fechado_em)}</td>
      </tr>`).join("");
  } catch (e) {
    body.innerHTML = `<tr><td colspan="8" class="vazio">Erro ao carregar: ${e.message}</td></tr>`;
  }
}

$("atualizar").addEventListener("click", carregarMovimentacoes);
carregarMovimentacoes();

// ---- peso ao vivo via WebSocket ----
function atualizarStatus(d) {
  const status = $("balanca-status");
  const dot = $("peso-dot");
  dot.className = "dot " + (d.fonte === "serial" ? "serial" : "simulador");
  let txt = "Fonte: " + (d.fonte === "serial" ? `serial ${d.porta}` : "simulador");
  if (d.ultima_linha) txt += "\nÚltima linha: " + d.ultima_linha;
  status.textContent = txt;
  status.className = "status" + (d.fonte === "serial" ? " serial" : "");
}

function conectarPeso() {
  const ws = new WebSocket(`ws://${location.host}/ws/peso`);
  ws.onmessage = (e) => {
    const d = JSON.parse(e.data);
    $("peso-atual").textContent = d.peso_atual != null ? d.peso_atual.toFixed(1) : "—";
    $("peso-estavel").textContent = d.peso_estavel != null
      ? `Peso estável: ${d.peso_estavel.toFixed(1)} kg (desvio ${d.desvio != null ? d.desvio : "—"})`
      : "Peso estável: aguardando...";
    atualizarStatus(d);
  };
  ws.onclose = () => setTimeout(conectarPeso, 2000);
}
conectarPeso();

// ---- portas seriais ----
function baudrateAtual() {
  return parseInt($("baudrate").value, 10) || 9600;
}

async function carregarPortas() {
  const sel = $("porta");
  const anterior = sel.value;
  try {
    const r = await fetch("/balanca/portas");
    const portas = await r.json();
    sel.innerHTML = "";
    if (!portas.length) {
      sel.innerHTML = `<option value="">Nenhuma porta encontrada</option>`;
      return;
    }
    portas.forEach(p => {
      const o = document.createElement("option");
      o.value = p.porta;
      o.textContent = `${p.porta} — ${p.descricao || p.fabricante || "sem descrição"}`;
      sel.appendChild(o);
    });
    if (anterior && portas.some(p => p.porta === anterior)) sel.value = anterior;
  } catch (e) {
    sel.innerHTML = `<option value="">Erro ao listar</option>`;
    $("balanca-status").textContent = "Erro ao listar portas: " + e.message;
  }
}

async function conectarPorta(porta) {
  const status = $("balanca-status");
  status.textContent = "Conectando...";
  try {
    const r = await fetch("/balanca/porta", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ porta, baudrate: baudrateAtual() }),
    });
    const d = await r.json();
    if (!r.ok) {
      status.textContent = "Erro: " + (d.detail || "falha ao conectar");
      status.className = "status";
      return;
    }
    atualizarStatus(d);
  } catch (e) {
    status.textContent = "Erro: " + e.message;
    status.className = "status";
  }
}

$("atualizar-portas").addEventListener("click", carregarPortas);

$("conectar-porta").addEventListener("click", () => {
  const porta = $("porta").value;
  if (!porta) { $("balanca-status").textContent = "Selecione uma porta."; return; }
  conectarPorta(porta);
});

$("usar-simulador").addEventListener("click", () => conectarPorta(null));

$("detectar-porta").addEventListener("click", async () => {
  const btn = $("detectar-porta");
  btn.disabled = true; btn.textContent = "Varrendo...";
  const status = $("balanca-status");
  status.textContent = "Varrendo portas em busca da balança...";
  try {
    const r = await fetch("/balanca/detectar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ baudrate: baudrateAtual() }),
    });
    const d = await r.json();
    if (d.porta) {
      $("porta").value = d.porta;
      await conectarPorta(d.porta);
    } else {
      status.textContent = "Nenhuma balança detectada.";
      status.className = "status";
    }
  } catch (e) {
    status.textContent = "Erro: " + e.message;
    status.className = "status";
  } finally {
    btn.disabled = false; btn.textContent = "Detectar";
  }
});

carregarPortas();

// ---- preview da foto ----
$("foto").addEventListener("change", () => {
  const f = $("foto").files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  const img = $("preview");
  img.src = url; img.style.display = "block";
});

// ---- análise ----
$("analisar").addEventListener("click", async () => {
  const ponto = $("ponto").value;
  const file = $("foto").files[0];
  if (!file) { mostrarResultado("Selecione uma foto.", false); return; }

  const btn = $("analisar");
  btn.disabled = true; btn.textContent = "Analisando...";

  try {
    const fd = new FormData();
    fd.append("arquivo", file);
    fd.append("ponto_codigo", ponto);

    if (ponto === "BALANCA") {
      const r = await fetch("/balanca/pesar", { method: "POST", body: fd });
      const d = await r.json();
      if (!r.ok) { mostrarResultado(JSON.stringify(d, null, 2), false); return; }
      if (!d.placa) {
        mostrarResultado(`Peso atual: ${d.peso} kg\nNenhuma placa reconhecida.`, false);
        return;
      }
      mostrarResultado(
        `Placa: ${d.placa} (${d.formato})  confiança: ${(d.confianca * 100).toFixed(1)}%\n` +
        `Peso: ${d.peso} kg\n` +
        `Pesagem #${d.pesagem_id} registrada  →  movimentação #${d.movimentacao_id}\n` +
        `Status: ${badge(d.movimentacao_tipo, d.movimentacao_status)}`
      );
    } else {
      fd.append("salvar", "true");
      const r = await fetch("/placas/reconhecer", { method: "POST", body: fd });
      const d = await r.json();
      if (!r.ok) { mostrarResultado(JSON.stringify(d, null, 2), false); return; }
      if (d.total === 0) {
        mostrarResultado("Nenhuma placa reconhecida na foto.", false);
        return;
      }
      const c = d.candidatos[0];
      let linhaMov = "";
      try {
        const mr = await fetch(`/movimentacoes?placa=${encodeURIComponent(c.placa)}&limite=1`);
        const movs = await mr.json();
        if (movs.length) {
          const m = movs[0];
          linhaMov = `\nMovimentação #${m.id}: ${m.status}${m.tipo ? " · " + m.tipo : ""}` +
            (m.peso_liquido != null ? ` · líquido ${m.peso_liquido} kg` : "");
        }
      } catch (e) {}
      mostrarResultado(
        `Placa: ${c.placa} (${c.formato})  confiança: ${(c.confianca * 100).toFixed(1)}%\n` +
        `Evento #${c.evento_id} registrado no ponto ${ponto}${linhaMov}`
      );
    }
  } catch (e) {
    mostrarResultado("Erro: " + e.message, false);
  } finally {
    btn.disabled = false; btn.textContent = "Iniciar análise";
    carregarMovimentacoes();
  }
});
</script>
</body>
</html>
